frr version 8.4
frr defaults traditional
hostname r3
no ipv6 forwarding
!
interface eth1
 ip address 10.0.23.2/30
!
interface eth2
 ip address 10.0.34.1/30
!
interface eth3
 ip address 10.0.13.2/30
!
interface eth4
 ip address 192.168.3.1/24
!
router rip
 network 10.0.23.0/30
 network 10.0.34.0/30
 network 10.0.13.0/30
 network 192.168.3.0/24
!
line vty
!
