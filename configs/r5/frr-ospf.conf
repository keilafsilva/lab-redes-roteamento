frr version 8.4
frr defaults traditional
hostname r5
no ipv6 forwarding
!
interface eth1
 ip address 10.0.45.2/30
!
interface eth2
 ip address 10.0.51.1/30
!
interface eth3
 ip address 192.168.5.1/24
!
router ospf
 network 10.0.45.0/30 area 0
 network 10.0.51.0/30 area 0
 network 192.168.5.0/24 area 0
!
line vty
!
